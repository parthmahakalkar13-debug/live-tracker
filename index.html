<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Geolocation System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 1.5rem;
    }

    .card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: block;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Live Telemetry Portal</h1>
    <p>Select your portal to either broadcast live GPS telemetry or monitor connected devices.</p>

    <div class="btn-group">
      <a href="share.html" class="btn btn-primary">📱 Open Broadcaster (Sender)</a>
      <a href="viewer.html" class="btn btn-secondary">🖥️ Open Dashboard (Viewer)</a>
    </div>
  </div>

</body>
</html>
