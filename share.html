<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Location Broadcaster</title>
</head>
<body style="font-family: sans-serif; padding: 2rem; text-align: center;">
  <h2>Device Telemetry Broadcaster</h2>
  <p id="status">Status: Disconnected</p>
  <button id="start-btn" style="padding: 10px 20px; font-size: 1rem; cursor: pointer;">
    Share My Live Location
  </button>

  <script>
    const socket = new WebSocket('ws://localhost:8080');
    const statusText = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');

    socket.onopen = () => { statusText.innerText = 'Status: Connected to Server'; };

    startBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('Geolocation not supported by this browser.');
        return;
      }

      statusText.innerText = 'Status: Streaming GPS data...';

      navigator.geolocation.watchPosition(
        (position) => {
          const payload = JSON.stringify({
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: new Date().toLocaleTimeString()
          });

          if (socket.readyState === WebSocket.OPEN) {
            socket.send(payload);
          }
        },
        (error) => {
          statusText.innerText = `Error: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    });
  </script>
</body>
</html>
