<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Map Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #header { padding: 1rem; background: #0f172a; color: white; display: flex; justify-content: space-between; }
    #map { flex: 1; }
  </style>
</head>
<body>
  <div id="header">
    <strong>Remote Telemetry Monitor</strong>
    <span id="telemetry-info">Waiting for incoming telemetry...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let marker = null;
    let circle = null;
    const telemetryInfo = document.getElementById('telemetry-info');

    const socket = new WebSocket('ws://localhost:8080');

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const { lat, lng, accuracy, timestamp } = data;

      telemetryInfo.innerText = `Last Ping: ${timestamp} \vert{} Lat:${lat.toFixed(5)}, Lng: ${lng.toFixed(5)} (±${Math.round(accuracy)}m)`;

      if (marker) map.removeLayer(marker);
      if (circle) map.removeLayer(circle);

      marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup(`<b>Target Device</b><br>Updated: ${timestamp}`).openPopup();
      circle = L.circle([lat, lng], { radius: accuracy, color: '#2563eb' }).addTo(map);

      map.setView([lat, lng], 16);
    };
  </script>
</body>
</html>
