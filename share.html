<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persistent Device Broadcaster</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
      padding: 1.5rem;
      background: #0f172a;
      color: #fff;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s ease;
    }
    .btn-start {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn-stop {
      background: #dc2626;
      color: white;
      margin-top: 0.5rem;
    }
    #status {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .badge {
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      background: #0f172a;
      font-family: monospace;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      border: 1px solid #334155;
      color: #38bdf8;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Persistent GPS Beacon</h2>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.5rem;">
      Once activated, tracking starts automatically on every page open.
    </p>

    <button id="start-btn" class="btn-start">📡 Enable Permanent Tracking</button>
    <button id="stop-btn" class="btn-stop" style="display: none;">🛑 Stop Tracking</button>

    <div id="status">Status: Initializing...</div>
    <div id="telemetry" class="badge">Telemetry: Waiting for fix...</div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDk1RS3Zn_fBpnA0uCoEFwb6aHcFcquRiE",
      authDomain: "live-tracker-9618d.firebaseapp.com",
      databaseURL: "https://live-tracker-9618d-default-rtdb.firebaseio.com",
      projectId: "live-tracker-9618d",
      storageBucket: "live-tracker-9618d.firebasestorage.app",
      messagingSenderId: "157274601724",
      appId: "1:157274601724:web:efbde222f2e4ed47a2ff79"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const statusText = document.getElementById('status');
    const telemetryText = document.getElementById('telemetry');

    let watchId = null;

    function startBroadcasting() {
      if (!navigator.geolocation) {
        statusText.innerText = "Error: Geolocation not supported.";
        return;
      }

      // Save preference so it auto-starts permanently
      localStorage.setItem('auto_track_enabled', 'true');

      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      statusText.innerText = "Acquiring high-accuracy GPS fix...";

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const payload = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: Math.round(pos.coords.accuracy),
            timestamp: new Date().toLocaleTimeString(),
            speed: pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) + " km/h" : "0 km/h"
          };

          db.ref('live_session/device_1').set(payload)
            .then(() => {
              statusText.innerHTML = "Status: <span style='color: #4ade80;'>🟢 Live & Streaming</span>";
              telemetryText.innerText = `Lat: ${payload.lat.toFixed(5)}, Lng: ${payload.lng.toFixed(5)} (±${payload.accuracy}m)`;
            })
            .catch((err) => {
              statusText.innerText = `Sync Error: ${err.message}`;
            });
        },
        (err) => {
          statusText.innerText = `GPS Error: ${err.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    function stopBroadcasting() {
      localStorage.removeItem('auto_track_enabled');
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      startBtn.style.display = 'block';
      stopBtn.style.display = 'none';
      statusText.innerText = "Status: Tracking Paused";
      telemetryText.innerText = "Telemetry: Stopped";
    }

    startBtn.addEventListener('click', startBroadcasting);
    stopBtn.addEventListener('click', stopBroadcasting);

    // Auto-resume check on page load
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('auto_track_enabled') === 'true') {
        startBroadcasting();
      } else {
        statusText.innerText = "Status: Ready to track";
      }
    });
  </script>
</body>
</html>
